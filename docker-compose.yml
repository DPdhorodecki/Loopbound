services:
  postgres:
    image: postgres:16-alpine
    container_name: loopbound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopbound
      POSTGRES_PASSWORD: loopbound
      POSTGRES_DB: loopbound
    ports:
      - '5432:5432'
    volumes:
      - loopbound-pgdata:/var/lib/postgresql/data

volumes:
  loopbound-pgdata:
