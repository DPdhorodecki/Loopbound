<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="8" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bg { fill: #FFFFFF; }
      .grid { stroke: #E8E8E8; stroke-width: 1; }
      .box { fill: #5B5F97; stroke: #3A3F70; stroke-width: 2; filter: url(#shadow); }
      .box-text { fill: #FFFFFF; font-family: 'Courier New', monospace; font-weight: bold; font-size: 17px; text-anchor: middle; }
      .box-text.small { font-size: 15px; }
      .arrow { stroke: #000000; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #000000; stroke: none; }
      .banner { fill: #3A3F70; }
      .banner-text { fill: #FFFFFF; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #3A3F70; font-family: 'Courier New', monospace; font-weight: bold; font-size: 24px; text-anchor: middle; }
      .note { fill: #3A3F70; font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; }
      .note.small { font-size: 14px; }
    </style>
  </defs>

