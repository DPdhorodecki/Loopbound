<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="8" dy="8" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .bg { fill: #ffffff; }
      .grid { stroke: #e8e8e8; stroke-width: 1; }
      .box { fill: #5B5F97; stroke: #3A3F70; stroke-width: 2; filter: url(#shadow); }
      .box-text { fill: #ffffff; font-family: 'Courier New', monospace; font-weight: bold; font-size: 18px; text-anchor: middle; }
      .arrow { stroke: #000000; stroke-width: 5; fill: #000000; stroke-linecap: round; stroke-linejoin: round; }
      .banner { fill: #3A3F70; }
      .banner-text { fill: #ffffff; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .title { fill: #3A3F70; font-family: 'Courier New', monospace; font-weight: bold; font-size: 24px; text-anchor: middle; }
      .diamond { fill: #5B5F97; stroke: #3A3F70; stroke-width: 2; filter: url(#shadow); }
      .diamond-text { fill: #ffffff; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect class="bg" width="1200" height="900" />

  <!-- Grade -->
  <g class="grid">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="520" x2="1200" y2="520" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="0" y1="680" x2="1200" y2="680" />
    <line x1="0" y1="720" x2="1200" y2="720" />
    <line x1="0" y1="760" x2="1200" y2="760" />
    <line x1="0" y1="800" x2="1200" y2="800" />
    <line x1="0" y1="840" x2="1200" y2="840" />
    <line x1="0" y1="880" x2="1200" y2="880" />
    <line x1="40" y1="0" x2="40" y2="900" />
    <line x1="80" y1="0" x2="80" y2="900" />
    <line x1="120" y1="0" x2="120" y2="900" />
    <line x1="160" y1="0" x2="160" y2="900" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="240" y1="0" x2="240" y2="900" />
    <line x1="280" y1="0" x2="280" y2="900" />
    <line x1="320" y1="0" x2="320" y2="900" />
    <line x1="360" y1="0" x2="360" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="440" y1="0" x2="440" y2="900" />
    <line x1="480" y1="0" x2="480" y2="900" />
    <line x1="520" y1="0" x2="520" y2="900" />
    <line x1="560" y1="0" x2="560" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="640" y1="0" x2="640" y2="900" />
    <line x1="680" y1="0" x2="680" y2="900" />
    <line x1="720" y1="0" x2="720" y2="900" />
    <line x1="760" y1="0" x2="760" y2="900" />
    <line x1="760" y1="0" x2="760" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="840" y1="0" x2="840" y2="900" />
    <line x1="880" y1="0" x2="880" y2="900" />
    <line x1="920" y1="0" x2="920" y2="900" />
    <line x1="960" y1="0" x2="960" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
    <line x1="1040" y1="0" x2="1040" y2="900" />
    <line x1="1080" y1="0" x2="1080" y2="900" />
    <line x1="1120" y1="0" x2="1120" y2="900" />
    <line x1="1160" y1="0" x2="1160" y2="900" />
  </g>

  <!-- Título -->
  <text class="title" x="600" y="40">FLUXOGRAMA — LOOPBOUND: KENNEDYTO E A FUGA</text>

  <!-- Banner lateral -->
  <rect class="banner" x="0" y="0" width="50" height="900" />
  <text class="banner-text" x="25" y="200" transform="rotate(-90 25,200)">INÍCIO · MENU · TUTORIAL · JOGAR · VITÓRIA · CRÉDITOS</text>

  <!-- ============ LINHA 1: Título → Login → Menu ============ -->
  <!-- Tela Título -->
  <rect class="box" x="100" y="120" width="220" height="60" rx="12" />
  <text class="box-text" x="210" y="150">TELA TÍTULO</text>

  <!-- Seta Título → Login -->
  <path class="arrow" d="M 320 150 L 370 150" />
  <path class="arrow" d="M 370 150 L 392 142 L 392 158 Z" />

  <!-- Login/Cadastro -->
  <rect class="box" x="380" y="120" width="240" height="60" rx="12" />
  <text class="box-text" x="500" y="150">LOGIN / CADASTRO</text>

  <!-- Seta Login → Menu -->
  <path class="arrow" d="M 620 150 L 670 150" />
  <path class="arrow" d="M 670 150 L 692 142 L 692 158 Z" />

  <!-- Menu Principal -->
  <rect class="box" x="680" y="120" width="240" height="60" rx="12" />
  <text class="box-text" x="800" y="150">MENU PRINCIPAL</text>

  <!-- ============ LINHA 2: Decisão "Já tem conta?" ============ -->
  <!-- Losango decisão -->
  <polygon class="diamond" points="500,260 590,260 590,400 500,400 410,400 410,260" />
  <text class="diamond-text" x="500" y="320">JÁ TEM</text>
  <text class="diamond-text" x="500" y="340">CONTA?</text>

  <!-- Seta não → Cadastrar -->
  <path class="arrow" d="M 590 330 L 800 330" />
  <path class="arrow" d="M 800 330 L 822 322 L 822 338 Z" />

  <!-- Cadastrar -->
  <rect class="box" x="810" y="300" width="220" height="60" rx="12" />
  <text class="box-text" x="920" y="330">CADASTRAR</text>

  <!-- Seta Cadastrar → Menu (seta longa) -->
  <path class="arrow" d="M 1030 330 L 960 410" />
  <path class="arrow" d="M 960 410 L 982 402 L 938 402 L 960 418 Z" />

  <!-- Menu (direita) -->
  <rect class="box" x="680" y="420" width="240" height="60" rx="12" />
  <text class="box-text" x="800" y="450">MENU</text>

  <!-- Seta sim → Menu -->
  <path class="arrow" d="M 500 330 L 700 410" />
  <path class="arrow" d="M 700 410 L 722 402 L 678 402 L 700 418 Z" />

  <!-- ============ LINHA 3: Escolher fase → Iniciar ============ -->
  <rect class="box" x="100" y="440" width="220" height="60" rx="12" />
  <text class="box-text" x="210" y="470">ESCOLHER FASE</text>

  <path class="arrow" d="M 320 470 L 370 470" />
  <path class="arrow" d="M 370 470 L 392 462 L 392 478 Z" />

  <rect class="box" x="380" y="440" width="240" height="60" rx="12" />
  <text class="box-text" x="500" y="470">INICIAR FASE</text>

  <!-- ============ LINHA 4: Loop de jogo ============ -->
  <rect class="box" x="100" y="540" width="340" height="60" rx="12" />
  <text class="box-text" x="270" y="570">LOOP DE JOGO:</text>
  <text class="box-text" x="270" y="596">INPUT → MOVER → ECO REGISTRA</text>

  <path class="arrow" d="M 440 570 L 500 570" />
  <path class="arrow" d="M 500 570 L 522 562 L 522 578 Z" />

  <!-- Losango "Ciclo acabou?" -->
  <polygon class="diamond" points="520,510 600,510 600,630 520,630 440,630 440,510" />
  <text class="diamond-text" x="520" y="550">CICLO</text>
  <text class="diamond-text" x="520" y="570">ACABOU?</text>

  <!-- Não → volta para loop -->
  <path class="arrow" d="M 560 570 L 720 570" />
  <path class="arrow" d="M 720 570 L 742 562 L 742 578 Z" />
  <path class="arrow" d="M 720 570 L 720 500" />
  <path class="arrow" d="M 720 500 L 702 482 L 738 482 Z" />
  <path class="arrow" d="M 720 500 L 420 500" />
  <path class="arrow" d="M 420 500 L 402 482 L 438 482 Z" />
  <path class="arrow" d="M 420 500 L 420 570" />
  <path class="arrow" d="M 420 570 L 402 588 L 438 588 Z" />

  <!-- Sim → Grava eco -->
  <path class="arrow" d="M 600 570 L 780 570" />
  <path class="arrow" d="M 780 570 L 802 562 L 802 578 Z" />

  <rect class="box" x="790" y="540" width="220" height="60" rx="12" />
  <text class="box-text" x="900" y="570">GRAVAR ECO</text>

  <!-- ============ LINHA 5: Decisão "Venceu?" ============ -->
  <polygon class="diamond" points="600,660 690,660 690,800 600,800 510,800 510,660" />
  <text class="diamond-text" x="600" y="700">VENCEU?</text>

  <!-- Não → Reiniciar fase -->
  <path class="arrow" d="M 690 730 L 850 730" />
  <path class="arrow" d="M 850 730 L 872 722 L 872 738 Z" />

  <rect class="box" x="860" y="700" width="200" height="60" rx="12" />
  <text class="box-text" x="960" y="730">REINICIAR FASE</text>

  <!-- Seta Reiniciar → Loop -->
  <path class="arrow" d="M 1060 730 L 520 730" />
  <path class="arrow" d="M 520 730 L 502 722 L 538 722 Z" />
  <path class="arrow" d="M 520 730 L 520 500" />
  <path class="arrow" d="M 520 500 L 502 482 L 538 482 Z" />

  <!-- Sim → Tela vitória -->
  <path class="arrow" d="M 690 730 L 300 730" />
  <path class="arrow" d="M 300 730 L 278 722 L 322 722 Z" />

  <rect class="box" x="100" y="700" width="240" height="60" rx="12" />
  <text class="box-text" x="220" y="730">TELA VITÓRIA</text>

  <path class="arrow" d="M 340 730 L 460 730" />
  <path class="arrow" d="M 460 730 L 482 722 L 482 738 Z" />

  <rect class="box" x="470" y="700" width="240" height="60" rx="12" />
  <text class="box-text" x="590" y="730">PRÓXIMA FASE</text>
  <text class="box-text" x="590" y="756">OU FIM</text>

  <!-- ============ LINHA 6: Pós-créditos ============ -->
  <rect class="box" x="470" y="800" width="340" height="60" rx="12" />
  <text class="box-text" x="640" y="825">PÓS-CRÉDITOS:</text>
  <text class="box-text" x="640" y="851">CHUCHUTY AINDA</text>
  <text class="box-text" x="640" y="877">ESTÁ VIVO</text>

  <path class="arrow" d="M 640 830 L 740 830" />
  <path class="arrow" d="M 740 830 L 762 822 L 762 838 Z" />

  <rect class="box" x="750" y="800" width="140" height="60" rx="30" />
  <text class="box-text" x="820" y="830">FIM</text>
</svg>
